<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TripMate AI - Dashboard</title>

  <!-- External Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Application CSS -->
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/components.css">
</head>

<body class="bg-slate-50 min-h-screen text-slate-800 antialiased">

  <!-- ===================================================== -->
  <!-- HEADER -->
  <!-- ===================================================== -->

  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">

    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">

      <div class="flex items-center gap-3">

        <div
          class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white text-xl font-bold shadow-md shadow-indigo-200"
        >
          ✈️
        </div>

        <div>
          <h1 class="text-xl font-extrabold text-slate-900 leading-tight">
            TripMate <span class="text-indigo-600">AI</span>
          </h1>

          <p class="text-xs text-slate-500 font-medium">
            Multi-Agent Travel Assistant
          </p>
        </div>

      </div>

      <div class="flex items-center gap-4">

        <span
          id="userInfo"
          class="text-xs font-semibold text-slate-600"
        ></span>

        <button
          onclick="logout()"
          class="text-xs text-rose-600 font-bold hover:underline"
        >
          Sign Out
        </button>

      </div>

    </div>

  </header>


  <!-- ===================================================== -->
  <!-- MAIN -->
  <!-- ===================================================== -->

  <main class="max-w-4xl mx-auto px-4 py-8 space-y-8">

    <!-- =================================================== -->
    <!-- TRAVEL INPUT -->
    <!-- =================================================== -->

    <div
      class="bg-white rounded-2xl p-6 shadow-xl shadow-slate-200/50 border border-slate-100"
    >

      <label
        for="userQuery"
        class="block text-sm font-bold text-slate-700 mb-2"
      >
        Where do you want to travel?
      </label>

      <div class="flex flex-col sm:flex-row gap-3">

        <input
          type="text"
          id="userQuery"
          placeholder="e.g. Plan a 2-week trip from Hyderabad to New York with budget recommendations..."
          class="flex-1 px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 transition text-sm text-slate-800"
        />

        <button
          onclick="generatePlan()"
          id="submitBtn"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-6 py-3 rounded-xl shadow-lg shadow-indigo-200 transition flex items-center justify-center gap-2 text-sm shrink-0"
        >
          <span>Generate Plan</span>
          🚀
        </button>

      </div>

    </div>


    <!-- =================================================== -->
    <!-- LOADING -->
    <!-- =================================================== -->

    <div
      id="loadingState"
      class="hidden text-center py-12 space-y-4"
    >

      <div
        class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent"
      ></div>

      <p
        class="text-sm font-semibold text-slate-600 animate-pulse"
      >
        Consulting travel specialist agents...
      </p>

    </div>


    <!-- =================================================== -->
    <!-- HUMAN APPROVAL -->
    <!-- =================================================== -->

    <div
      id="approvalBanner"
      class="hidden bg-amber-50 border border-amber-200 rounded-2xl p-6 shadow-lg space-y-4"
    >

      <div class="flex items-start gap-3">

        <span class="text-2xl">⚠️</span>

        <div>

          <h3 class="text-base font-bold text-amber-900">
            Itinerary Approval Required
          </h3>

          <p class="text-sm text-amber-700 mt-1">
            Review the generated draft below.
            You can approve it or provide feedback for revisions.
          </p>

        </div>

      </div>


      <div class="space-y-3 pt-2">

        <textarea
          id="humanFeedback"
          placeholder="Optional revision instructions..."
          class="w-full p-3 rounded-xl border border-amber-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/20"
          rows="2"
        ></textarea>


        <div class="flex gap-3">

          <button
            onclick="sendApproval(true)"
            class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold px-5 py-2.5 rounded-xl transition"
          >
            Approve Itinerary ✓
          </button>

          <button
            onclick="sendApproval(false)"
            class="bg-rose-600 hover:bg-rose-700 text-white text-sm font-semibold px-5 py-2.5 rounded-xl transition"
          >
            Request Changes ✕
          </button>

        </div>

      </div>

    </div>


    <!-- =================================================== -->
    <!-- RESPONSE -->
    <!-- =================================================== -->

    <div
      id="responseContainer"
      class="hidden bg-white rounded-2xl p-8 shadow-xl border border-slate-100"
    >

      <div
        id="formattedOutput"
        class="markdown-content"
      ></div>

    </div>

  </main>


  <!-- ===================================================== -->
  <!-- APPLICATION JAVASCRIPT -->
  <!-- ===================================================== -->

  <!-- IMPORTANT:
       Keep this order.
  -->

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/travel.js"></script>


  <!-- ===================================================== -->
  <!-- PAGE INITIALIZATION -->
  <!-- ===================================================== -->

  <script>

    // -------------------------------------------------------
    // Require Authentication
    // -------------------------------------------------------

    requireAuth();


    // -------------------------------------------------------
    // Display Logged-in User
    // -------------------------------------------------------

    try {

      const user = JSON.parse(
        localStorage.getItem(CONFIG.USER_KEY) || '{}'
      );

      if (user.name) {

        document.getElementById(
          'userInfo'
        ).innerText = `👤 ${user.name}`;

      } else if (user.email) {

        document.getElementById(
          'userInfo'
        ).innerText = `👤 ${user.email}`;

      }

    } catch (error) {

      console.error(
        'Failed to load user information:',
        error
      );

    }

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TripMate AI - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-8 border border-slate-100">
    <div class="text-center mb-8">
      <div class="w-12 h-12 bg-indigo-600 text-white text-2xl font-bold rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-lg shadow-indigo-200">
        ✈️
      </div>
      <h2 id="formTitle" class="text-2xl font-extrabold text-slate-900">Welcome Back</h2>
      <p id="formSubtitle" class="text-xs text-slate-500 mt-1">Sign in to plan your trips with TripMate AI</p>
    </div>

    <form id="authForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
      <div id="nameGroup" class="hidden">
        <label class="block text-xs font-bold text-slate-700 mb-1">Full Name</label>
        <input type="text" id="fullName" class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Email Address</label>
        <input type="email" id="email" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
        <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-600 outline-none">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-200 transition text-sm">
        Sign In
      </button>
    </form>

    <div class="mt-6 text-center">
      <button onclick="toggleMode()" id="toggleBtn" class="text-xs font-semibold text-indigo-600 hover:underline">
        Don't have an account? Sign Up
      </button>
    </div>
  </div>

  <!-- Scripts Loaded in Dependency Order -->
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>

  <script>
    let isLogin = true;

    // Redirect to dashboard if already logged in
    if (isAuthenticated()) {
      window.location.href = '/pages/dashboard.html';
    }

    function toggleMode() {
      isLogin = !isLogin;
      document.getElementById('formTitle').innerText = isLogin ? 'Welcome Back' : 'Create Account';
      document.getElementById('formSubtitle').innerText = isLogin ? 'Sign in to plan your trips' : 'Start your AI travel experience';
      document.getElementById('nameGroup').classList.toggle('hidden', isLogin);
      document.getElementById('submitBtn').innerText = isLogin ? 'Sign In' : 'Create Account';
      document.getElementById('toggleBtn').innerText = isLogin ? "Don't have an account? Sign Up" : "Already have an account? Sign In";
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      const fullName = document.getElementById('fullName').value.trim();

      const payload = isLogin ? { email, password } : { email, password, full_name: fullName };
      submitAuth(isLogin, payload);
    }
  </script>
</body>
</html>
